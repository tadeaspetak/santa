name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: "Build & release"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check the tag matches the Makefile version
        run: grep -qx "VERSION := ${GITHUB_REF_NAME}" Makefile || { echo "Makefile VERSION doesn't match the tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"
      - name: Test
        run: make test
      - name: Build
        run: make binaries
      # the annotated tag's message becomes the release notes, edit them on GitHub afterwards if needed
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" bin/santa-mac bin/santa-win.exe \
            --verify-tag --notes-from-tag --title "Release ${GITHUB_REF_NAME}"
